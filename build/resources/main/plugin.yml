name: L7DefensePlugin
version: '1.0.0'
main: com.l7defense.L7DefensePlugin
api-version: '1.20'
description: High-Performance L7 DDoS Defense Plugin with Real-time OP Alert System
author: L7Defense

# Paper 런타임 라이브러리 자동 다운로드 (서버 시작 시 자동으로 가져옴)
# https://docs.papermc.io/paper/dev/plugin-yml/#libraries
libraries:
  - com.github.ben-manes.caffeine:caffeine:3.1.8
  - redis.clients:jedis:5.1.0
  - org.apache.commons:commons-pool2:2.12.0

commands:
  l7def:
    description: L7 Defense 관리 명령어
    usage: /l7def <alert|status|unblock|reload>
    permission: l7defense.admin

permissions:
  l7defense.admin:
    description: L7 Defense 관리 권한
    default: op
