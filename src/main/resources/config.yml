# ═══════════════════════════════════════════
#  L7 Defense Plugin — Configuration
# ═══════════════════════════════════════════

# 접속 빈도 제한 (Rate Limiting)
rate-limit:
  max-connections: 20
  window-seconds: 30

# 핑/MOTD 플러드 방어
ping-flood:
  max-pings: 15
  window-seconds: 10

# IP 차단 설정
blocking:
  duration-minutes: 10
  max-cache-size: 50000

# 공격 감지 설정
attack-detection:
  threshold: 10
  denial-threshold: 50
  evaluation-interval-seconds: 30
  window-seconds: 60

# 봇 닉네임 필터
bot-filter:
  enabled: false
  suspicious-threshold: 3

# ─── v1.3 고급 휴리스틱 및 방어 기능 ───

advanced-heuristics:
  # 1. 핑 사전 검증 (Ping-before-Join)
  # 진짜 플레이어는 서버 목록에서 핑을 보낸 뒤 접속합니다. 핑 기록이 없으면 소프트 캡챠로 보냅니다.
  ping-before-join:
    enabled: false
    # true: 공격 중일 때만 검사, false: 항상 검사
    only-under-attack: true

  # 2. 재접속 검증 (Soft Captcha)
  # 의심스러운 IP를 즉시 차단하지 않고 킥한 뒤, 지정된 시간 안에 다시 접속하면 통과시킵니다.
  rejoin-verification:
    enabled: false
    min-delay-seconds: 3   # 킥 후 최소 3초는 기다려야 함 (단순 봇 스크립트 차단)
    max-delay-seconds: 15  # 15초 내에 다시 들어와야 인증 성공

  # 3. 호스트네임 검증
  # 플레이어가 접속할 때 사용한 도메인/IP를 검사합니다.
  hostname-validation:
    enabled: false
    # 숫자 IP(예: 123.45.67.89:25565)로 직접 접속하는 경우 차단 (봇넷 포트 스캔 방어)
    block-numeric-ip: false
    # 허용할 도메인 목록 (비워두면 도메인 형식인지 확인만 함)
    # allowed-domains: ["play.myserver.com"]
    allowed-domains: []

# 4. VPN / 프록시 / 데이터센터 차단 (v1.4 GeoIP 연동)
anti-vpn:
  enabled: false
  only-under-attack: true

# 5. 국가 기반 화이트리스트 락다운 (v1.4 GeoIP)
# 공격 시 지정된 국가 외의 모든 해외 IP 접속을 차단합니다.
geoip:
  block-foreign-under-attack: false
  # 허용할 국가 코드 (예: KR, US, JP)
  allowed-countries: ["KR"]

# 6. 인게임 패킷 플러드 방어 (v1.4 Server Crusher 방어)
# 캡챠를 뚫고 들어와 인벤토리나 아이템 상호작용 패킷을 초당 수백 번 보내 서버 틱을 깎는 크러셔 방어
post-login:
  packet-spam-filter:
    enabled: false
    # 1초에 발생할 수 있는 최대 상호작용 횟수
    max-actions-per-sec: 40

# 7. OS 방화벽 연동 (리눅스 전용)
# Java/Netty 부하를 줄이기 위해 OS 명령어(iptables)를 직접 실행해 커널에서 차단합니다.
# 주의: 서버를 구동하는 유저에게 sudo 권한이나 iptables 실행 권한이 필요합니다.
firewall:
  enabled: false
  # {ip} 부분은 실제 차단될 IP로 치환됩니다.
  command-block: "sudo iptables -A INPUT -s {ip} -j DROP"
  command-unblock: "sudo iptables -D INPUT -s {ip} -j DROP"

# 8. 대형 네트워크 전용 방어 모듈 (v1.5 Endgame)
endgame-features:
  # 클라이언트 핑거프린팅: 접속 후 minecraft:brand 패킷이 너무 빨리 오면(봇 스크립트) 킥
  brand-fingerprinting:
    enabled: false
  
  # 행동 분석: 기계적인 완벽한 직선/스냅 에임 뷰 꺾기 차단 (Baritone 등)
  movement-heuristics:
    enabled: false

  # Redis 글로벌 밴 동기화 (BungeeCord 등 멀티 서버 환경용)
  redis-sync:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    password: ""

# ─── v2.0 엑스레이 패킷 난수화 및 허니팟 설정 ───
anti_xray:
  packet-obfuscation:
    enabled: true
    # Paper 서버의 config/paper-world-defaults.yml 내 engine-mode: 2를 자동으로 활성화 및 유지
    auto-configure-paper-engine2: true
    # 벽에 완전히 둘러싸여 노출되지 않은 광석을 패킷 수준에서 돌/심층암으로 위장 (시각적 텍스처팩/ESP 차단)
    client-packet-masking: true
    # ESP를 켠 유저를 유인하기 위해 밀폐된 암석에 가짜 다이아몬드 패킷 주입 (적발 시 즉각 경고)
    packet-decoy-traps: true
    # 유저 주변에 유지할 자동 가짜 다이아 허니팟 개수 (1~5)
    max-decoys-per-player: 3
    # 허니팟 자동 배치 반경 (최소 4블록, 최대 8블록)
    decoy-min-distance: 4
    decoy-max-distance: 8
    # 허니팟 자동 소멸 대기시간 (초) - 미채굴 시 돌로 자동 원상복구
    decoy-lifetime-seconds: 45
  heuristics:
    # 비정상 채광 통계 감지 (최근 5분 내 최소 총 채굴 블록 수)
    min-total-blocks: 12
    # 최소 희귀 광석 채굴 수 (다이아몬드, 고대잔해 등)
    min-rare-ores: 3
    # 희귀 광석 채굴 비율 임계치 (0.20 = 20%)
    rare-ore-ratio: 0.20

# ─── 알림 및 예외 처리 ───

alert:
  interval-seconds: 5

whitelist:
  name-bypass-all: true
  players:
    # - "Player123"
  ips:
    - "127.0.0.1"
    - "::1"
proxy:
  enabled: false

# ─── 동적 모듈 제어 및 처벌 수위 설정 (v1.6+) ───
# 처벌 수위 옵션:
#   NOTIFY : 강제 퇴장(Kick) 없이 플레이어에게 주의 경고 메시지 전송 및 관리자/콘솔 알림 (오탐 방지 기본 권장값)
#   KICK   : 1회성 강제 퇴장 처리 (블랙리스트 차단 X)
#   BAN    : IP 블랙리스트 등재 및 차단
dynamic-modules:
  ping:
    enabled: false
    penalty: NOTIFY
  vpn:
    enabled: false
    penalty: NOTIFY
  entropy:
    enabled: false
    penalty: NOTIFY
  gui_captcha:
    enabled: true
    penalty: NOTIFY
  entity_captcha:
    enabled: true
    penalty: NOTIFY
  rp_captcha:
    enabled: true
    penalty: NOTIFY
  map_captcha:
    enabled: true
    penalty: NOTIFY
  spam:
    enabled: false
    penalty: NOTIFY
  movement:
    enabled: false
    penalty: NOTIFY
  brand:
    enabled: false
    penalty: NOTIFY
  exploit:
    enabled: true
    penalty: NOTIFY
  chat_ai:
    enabled: true
    penalty: NOTIFY
  geyser_block:
    enabled: true
    penalty: NOTIFY
  slp_crasher:
    enabled: true
    penalty: NOTIFY
  honeypot:
    enabled: true
    penalty: NOTIFY
  macro_check:
    enabled: true
    penalty: NOTIFY
  map_stealer:
    enabled: true
    penalty: NOTIFY
  light_crasher:
    enabled: true
    penalty: NOTIFY
  anti_xray:
    enabled: true
    penalty: NOTIFY

# 기본 검증 팩은 저장소에 포함된 빈 팩입니다. 자체 CDN을 사용하려면 URL과 실제 SHA-1을 함께 지정하세요.
captcha:
  resource-pack-url: "https://raw.githubusercontent.com/antiyoon1234-dot/Aegis-L7/main/src/main/resources/captcha/verification-v1.zip"
  resource-pack-sha1: "e47b740c54f7192c31c63f4cb7d30b9818d2adc1"
